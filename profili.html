<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Profilo</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">
            <h2 style="margin: 0; color: var(--primary-cyan); font-size: 1.15rem;">👤 Profilo</h2>
        </div>

        <div class="nav-controls">
            <a href="https://www.legaseriea.it" target="_blank" class="seriea-logo-container" title="Vai al sito Serie A">
                SERIE A
            </a>
            <button class="hamburger-btn" onclick="toggleNavMenu()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="nav-links" id="nav-menu">
            <a href="hub.html">🏠 Hub Schedina</a>
            <a href="community.html">👥 Community</a>
            <a href="classifica.html">🏆 Classifica</a>
            <a href="profili.html" class="active">👤 Profilo</a>
            <a href="https://discord.gg/Gmn6zE942" target="_blank" style="color: #5865F2;">💬 Server Discord</a>
            <a href="admin.html" id="admin-link" style="display: none; color: #ff5252;">⚙️ Pannello Admin</a>
            <a href="#" onclick="logout()" style="color: #ef4444;">🚪 Esci</a>
        </div>
    </div>

    <div class="card" style="text-align: center;">
        <img id="profile-avatar" src="" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-cyan); margin-bottom: 10px;">
        <h3 id="profile-username" style="color: var(--primary-cyan);">Utente</h3>
        <p id="profile-role" style="font-size: 0.85rem; color: var(--text-muted);">Ruolo</p>
    </div>

    <div class="card">
        <h3>🖼️ Modifica Avatar (URL)</h3>
        <input type="text" id="avatar-url-input" placeholder="https:// esempio.com/foto.jpg" style="margin-top: 10px;">
        <button onclick="updateUserAvatar()" style="margin-top: 8px;">Salva Avatar</button>
    </div>

    <div class="card">
        <h3>🏆 Missioni & Ricompense</h3>
        <div id="missions-list" style="margin-top: 12px;"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const currentUser = getCurrentUser();
            const profile = getUserProfile(currentUser);

            document.getElementById('profile-avatar').src = profile.avatar;
            document.getElementById('profile-username').innerText = currentUser;
            document.getElementById('profile-role').innerText = `Ruolo: ${getCurrentRole().toUpperCase()}`;

            const missionsContainer = document.getElementById('missions-list');
            missionsContainer.innerHTML = '';
            MISSIONS.forEach(m => {
                let isCompleted = profile.completedMissions.includes(m.id);
                missionsContainer.innerHTML += `
                    <div style="background: var(--input-bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid ${isCompleted ? 'var(--primary-green)' : 'var(--text-muted)'};">
                        <strong>${m.name}</strong> ${isCompleted ? '✅' : '🔒'}<br>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">${m.desc}</span><br>
                        <span style="font-size: 0.75rem; color: ${m.rewardColor};">Premio: ${m.rewardName}</span>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
