<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Profilo Utente</title>
    
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111827;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #1f293d;
            margin-bottom: 20px;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }
        .nav-links a.active, .nav-links a:hover {
            color: #00e5ff;
        }
        .card {
            background: #111827;
            border: 1px solid #1f293d;
            padding: 25px;
            border-radius: 16px;
            max-width: 500px;
            margin: 0 auto 20px auto;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00e5ff;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0d1424;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #00e5ff;
            color: #090d16;
            font-weight: bold;
            cursor: pointer;
        }
        .color-palette {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ffffff33;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <h2 style="margin: 0; color: #00e5ff;">⚽ SantosPredictor</h2>
        <div class="nav-links">
            <a href="hub.html">Hub Schedina</a>
            <a href="community.html">Community</a>
            <a href="classifica.html">Classifica</a>
            <a href="profili.html" class="active">Profilo</a>
            <a href="admin.html" id="admin-link" style="display: none; color: #ff5252;">Admin</a>
            <a href="#" onclick="logout()" style="color: #ef4444;">Esci</a>
        </div>
    </div>

    <!-- Scheda Profilo -->
    <div class="card">
        <div class="profile-header">
            <img id="my-avatar" class="profile-avatar" src="" alt="Avatar">
            <div>
                <h2 id="my-username" style="margin: 0;">-</h2>
                <span id="my-role" style="color: #94a3b8; font-size: 0.9rem;">Player</span>
            </div>
        </div>

        <hr style="border-color: #1f293d; margin: 20px 0;">

        <h3>🖼️ Cambia Foto Profilo</h3>
        <p style="color: #94a3b8; font-size: 0.85rem;">Incolla il link (URL) di un'immagine online per impostarla come avatar:</p>
        <input type="text" id="avatar-url-input" placeholder="https://esempio.com/foto.jpg">
        <button onclick="updateUserAvatar()">Aggiorna Foto</button>

        <hr style="border-color: #1f293d; margin: 20px 0;">

        <h3>🎨 Colore Nome (Sbloccabili)</h3>
        <p style="color: #94a3b8; font-size: 0.85rem;">Completa le missioni per sbloccare nuovi colori per il tuo nome:</p>
        <div class="color-palette" id="color-picker-container">
            <!-- I pallini dei colori sbloccati verranno inseriti via JS -->
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const user = getCurrentUser();
            if (!user) return;

            const profile = getUserProfile(user);

            // Carica dati attuali nel profilo
            document.getElementById('my-avatar').src = profile.avatar;
            document.getElementById('my-username').innerText = user;
            document.getElementById('my-username').style.color = profile.color;
            document.getElementById('my-role').innerText = getCurrentRole().toUpperCase();

            // Mostra i colori sbloccati
            const colorContainer = document.getElementById('color-picker-container');
            if (colorContainer) {
                colorContainer.innerHTML = '';
                profile.unlockedColors.forEach(hex => {
                    colorContainer.innerHTML += `
                        <div class="color-dot" style="background-color: ${hex};" onclick="selectNameColor('${hex}')" title="Seleziona colore"></div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
