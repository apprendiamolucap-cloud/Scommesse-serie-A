<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Hub Schedina</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Navigation Bar con Logo Serie A e Tre Lineette -->
    <div class="navbar">
        <div class="nav-brand">
            <h2 style="margin: 0; color: var(--primary-cyan); font-size: 1.15rem;">⚽ SantosPredictor</h2>
        </div>

        <div class="nav-controls">
            <!-- Logo Serie A che porta al sito ufficiale -->
            <a href="https://www.legaseriea.it" target="_blank" title="Vai al sito Serie A">
                <img src="https://img.legaseriea.it/v3/assets/blt3f120170a48a85f4/bltcb2a353d98fb83fa/669622d561a3371fa9cf89a9/SerieA_Enilive_Full_RGB.png" alt="Serie A" class="seriea-logo">
            </a>

            <!-- Pulsante con 3 Lineette (Hamburger) -->
            <button class="hamburger-btn" onclick="toggleNavMenu()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- Menu a scomparsa -->
        <div class="nav-links" id="nav-menu">
            <a href="hub.html" class="active">🏠 Hub Schedina</a>
            <a href="community.html">👥 Community</a>
            <a href="classifica.html">🏆 Classifica</a>
            <a href="profili.html">👤 Profilo</a>
            <a href="https://discord.gg/Gmn6zE942" target="_blank" style="color: #5865F2;">💬 Server Discord</a>
            <a href="admin.html" id="admin-link" style="display: none; color: #ff5252;">⚙️ Pannello Admin</a>
            <button id="device-btn" onclick="toggleDeviceMode()">🖥️ Vista PC</button>
            <a href="#" onclick="logout()" style="color: #ef4444;">🚪 Esci</a>
        </div>
    </div>

    <!-- Stato Schedina e Utente -->
    <div class="card" style="margin-bottom: 15px; text-align: center;">
        <div id="user-display" style="font-weight: bold; font-size: 1.05rem; color: var(--primary-cyan); margin-bottom: 6px;">
            👤 Utente
        </div>
        <div id="lock-status"></div>
    </div>

    <!-- Lista Partite Schedina -->
    <div id="matches-list"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            applyDeviceMode();
            loadHubMatches();
        });
    </script>
</body>
</html>
