<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Hub Schedina</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Navigation Bar con Link Discord integrato -->
    <div class="navbar">
        <h2 style="margin: 0; color: var(--primary-cyan);">⚽ SantosPredictor</h2>
        <div class="nav-links">
            <a href="hub.html" class="active">Hub Schedina</a>
            <a href="community.html">Community</a>
            <a href="classifica.html">Classifica</a>
            <a href="profili.html">Profilo</a>
            <a href="https://discord.gg/Gmn6zE942" target="_blank" style="color: #5865F2; display: flex; align-items: center; gap: 4px;">💬 Discord</a>
            <a href="admin.html" id="admin-link" style="display: none; color: #ff5252;">Admin</a>
            <button id="device-btn" onclick="toggleDeviceMode()" style="width: auto; padding: 6px 10px; font-size: 0.8rem; background: #1f293d; color: var(--primary-cyan);">📱 Vista Tel</button>
            <a href="#" onclick="logout()" style="color: #ef4444;">Esci</a>
        </div>
    </div>

    <!-- Stato Schedina e Utente -->
    <div class="card" style="margin-bottom: 15px; text-align: center;">
        <div id="user-display" style="font-weight: bold; font-size: 1.05rem; color: var(--primary-cyan); margin-bottom: 6px;">
            👤 Utente
        </div>
        <div id="lock-status"></div>
    </div>

    <!-- Lista Partite Schedina -->
    <div id="matches-list"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            applyDeviceMode();
            loadHubMatches();
        });
    </script>
</body>
</html>
