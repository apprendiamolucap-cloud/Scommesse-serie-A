<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div class="card" style="width: 100%; max-width: 400px;">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Serie_A_logo_2022.svg" alt="Serie A" style="height: 45px; margin-bottom: 10px;">
            <h2 class="brand-title" style="font-size: 1.5rem; margin:0;">SantosPredictor</h2>
        </div>
        
        <label>Username Giocatore:</label>
        <input type="text" id="username" placeholder="Inserisci il tuo nome">

        <label>Ruolo:</label>
        <select id="role" onchange="toggleAdminCode(this.value)">
            <option value="player">Player</option>
            <option value="admin">Admin</option>
        </select>

        <div id="admin-code-container" style="display: none;">
            <label>Codice Segreto Admin:</label>
            <input type="password" id="admin-code" placeholder="Password admin">
        </div>

        <button onclick="login()" style="margin-top: 15px;">Accedi all'App</button>
    </div>

    <script src="js/app.js"></script>
    <script>
        function toggleAdminCode(val) {
            document.getElementById('admin-code-container').style.display = val === 'admin' ? 'block' : 'none';
        }
    </script>
</body>
</html>
