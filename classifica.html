<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Classifica</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
            font-size: 0.9rem;
        }
        th {
            color: var(--primary-cyan);
            font-size: 0.85rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">
            <h2 style="margin: 0; color: var(--primary-cyan); font-size: 1.15rem;">🏆 Classifica</h2>
        </div>

        <div class="nav-controls">
            <a href="https://www.legaseriea.it" target="_blank" class="seriea-logo-container" title="Vai al sito Serie A">
                SERIE A
            </a>
            <button class="hamburger-btn" onclick="toggleNavMenu()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="nav-links" id="nav-menu">
            <a href="hub.html">🏠 Hub Schedina</a>
            <a href="community.html">👥 Community</a>
            <a href="classifica.html" class="active">🏆 Classifica</a>
            <a href="profili.html">👤 Profilo</a>
            <a href="https://discord.gg/Gmn6zE942" target="_blank" style="color: #5865F2;">💬 Server Discord</a>
            <a href="admin.html" id="admin-link" style="display: none; color: #ff5252;">⚙️ Pannello Admin</a>
            <a href="#" onclick="logout()" style="color: #ef4444;">🚪 Esci</a>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; color: var(--primary-cyan); text-align: center;">📊 Classifica Generale Lega</h3>
        <table>
            <thead>
                <tr>
                    <th>Pos</th>
                    <th>Player</th>
                    <th>Punti</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>

        <div id="admin-reset-box" style="display: none; margin-top: 20px;">
            <button class="btn-danger" onclick="resetLeaderboard()">Reset Classifica</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadLeaderboard();
            if (getCurrentRole() === 'admin') {
                const resetBox = document.getElementById('admin-reset-box');
                if (resetBox) resetBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
