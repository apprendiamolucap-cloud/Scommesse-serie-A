<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Community</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <h2 style="margin: 0; color: var(--primary-cyan);">👥 Community</h2>
        <div class="nav-links">
            <a href="hub.html">Hub Schedina</a>
            <a href="community.html" class="active">Community</a>
            <a href="classifica.html">Classifica</a>
            <a href="profili.html">Profilo</a>
            <a href="admin.html" id="admin-link" style="display: none; color: #ff5252;">Admin</a>
            <button id="device-btn" onclick="toggleDeviceMode()" style="width: auto; padding: 6px 10px; font-size: 0.8rem; background: #1f293d; color: var(--primary-cyan);">📱 Vista Tel</button>
            <a href="#" onclick="logout()" style="color: #ef4444;">Esci</a>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
        <p style="color: var(--text-muted); font-size: 0.85rem;">Confronta i pronostici inviati da tutti gli altri giocatori della lega:</p>
    </div>

    <!-- Contenitore delle schedine inviate da tutti i player -->
    <div id="all-predictions-list"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            applyDeviceMode();
            loadAllPlayerPredictions();
        });
    </script>
</body>
</html>
