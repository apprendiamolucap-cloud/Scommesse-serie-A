<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SantosPredictor - Pannello Admin</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="navbar">
        <div class="nav-brand">
            <h2 style="margin: 0; color: #ff5252; font-size: 1.15rem;">⚙️ Admin Panel</h2>
        </div>

        <div class="nav-controls">
            <a href="https://www.legaseriea.it" target="_blank" class="seriea-logo-container" title="Vai al sito Serie A">
                SERIE A
            </a>
            <button class="hamburger-btn" onclick="toggleNavMenu()" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="nav-links" id="nav-menu">
            <a href="hub.html">🏠 Hub Schedina</a>
            <a href="community.html">👥 Community</a>
            <a href="classifica.html">🏆 Classifica</a>
            <a href="profili.html">👤 Profilo</a>
            <a href="https://discord.gg/Gmn6zE942" target="_blank" style="color: #5865F2;">💬 Server Discord</a>
            <a href="admin.html" class="active" style="color: #ff5252;">⚙️ Pannello Admin</a>
            <a href="#" onclick="logout()" style="color: #ef4444;">🚪 Esci</a>
        </div>
    </div>

    <div class="card" style="text-align: center;">
        <h3>🔒 Blocco Globale Schedine</h3>
        <p id="admin-lock-desc" style="font-size: 0.9rem; color: var(--text-muted); margin: 10px 0 18px 0;">Stato caricamento...</p>
        <button id="toggle-lock-btn" onclick="togglePredictionsLock()">Chiudi Pronostici Tutti</button>
    </div>

    <div class="card">
        <h3>➕ Aggiungi Nuova Partita</h3>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">
            <input type="text" id="homeTeam" placeholder="Squadra di Casa (es. Inter)">
            <input type="text" id="awayTeam" placeholder="Squadra Ospite (es. Milan)">
            <button onclick="addMatch()">Crea Partita</button>
            <button onclick="loadSampleSerieAMatches()" style="background: #1f293d; color: var(--primary-cyan); margin-top: 5px;">Carica Giornata Serie A Standard</button>
        </div>
    </div>

    <div class="card">
        <h3>⚽ Risultati Reali Giornata</h3>
        <div id="admin-matches-list" style="margin-top: 15px;"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            if (getCurrentRole() !== 'admin') {
                alert("Accesso negato! Pagina riservata all'Admin.");
                window.location.href = 'hub.html';
                return;
            }
            loadAdminPanel();
        });
    </script>
</body>
</html>
