<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestione Partite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <span>Pannello Admin</span>
        <div>
            <a href="hub.html">Torna all'Hub</a>
            <a href="classifica.html">Classifica</a>
            <button onclick="logout()" class="btn-logout">Esci</button>
        </div>
    </nav>

    <div class="container">
        <h2>Aggiungi Nuova Partita</h2>
        <div class="card">
            <input type="text" id="homeTeam" placeholder="Squadra Casa (es. Inter)">
            <input type="text" id="awayTeam" placeholder="Squadra Ospite (es. Milan)">
            <button onclick="addMatch()">Crea Partita Singola</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
            <button onclick="loadSampleSerieAMatches()" style="background-color: #28a745; color: white;">⚡ Carica Giornata Serie A (Top Match)</button>
        </div>

        <h2>Partite Create (Inserisci Risultato Reale)</h2>
        <div id="admin-matches-list"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
        checkAuth();
        if (getCurrentRole() !== 'admin') {
            alert('Accesso negato! Solo gli admin possono accedere a questa pagina.');
            window.location.href = 'hub.html';
        }
        loadAdminMatches();
    </script>
</body>
</html>
